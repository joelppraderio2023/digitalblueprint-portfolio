<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LógIcA — imagen para compartir</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Imagen Open Graph 1200x630: se exporta a assets/og-image.jpg */
  :root { --blue: #2340FF; --lime: #D6FF3B; --pink: #FF7AD1; --cream: #FFF8EC; --black: #0B0B0B; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--blue); color: var(--cream); font-family: 'Bricolage Grotesque', sans-serif; padding: 64px 72px; position: relative; }
  .mono { font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .06em; }
  .top { display: flex; justify-content: space-between; align-items: center; color: var(--lime); font-size: 22px; }
  .wm { font-size: 150px; font-weight: 800; letter-spacing: -.06em; line-height: 1; margin-top: 46px; }
  .wm b { color: var(--lime); }
  h1 { font-size: 54px; font-weight: 800; letter-spacing: -.035em; line-height: 1.05; margin-top: 22px; max-width: 900px; }
  h1 span { background: var(--lime); color: var(--black); border: 5px solid var(--black); border-radius: 16px; padding: 0 12px; box-shadow: 6px 6px 0 var(--black); }
  .chips { position: absolute; left: 72px; bottom: 60px; display: flex; gap: 14px; }
  .chip { background: var(--cream); color: var(--black); border: 4px solid var(--black); border-radius: 999px; padding: 10px 22px; font-size: 22px; font-weight: 700; box-shadow: 5px 5px 0 var(--black); }
  .sticker { position: absolute; right: 80px; top: 150px; width: 210px; height: 210px; border-radius: 50%; background: var(--pink); color: var(--black); border: 5px solid var(--black); box-shadow: 8px 8px 0 var(--black); display: grid; place-items: center; text-align: center; font-weight: 800; font-size: 30px; line-height: 1.05; transform: rotate(10deg); }
</style>
</head>
<body>
  <div class="top mono"><span>logicawebs.com.ar</span><span>Argentina</span></div>
  <div class="wm">Lóg<b>I</b>c<b>A</b></div>
  <h1>Páginas web y tiendas online que <span>trabajan por vos</span></h1>
  <div class="sticker">Desde<br>$99.900</div>
  <div class="chips"><span class="chip">Lista en 7 días</span><span class="chip">Dominio incluido</span><span class="chip">Precio fijo</span></div>
</body>
</html>
